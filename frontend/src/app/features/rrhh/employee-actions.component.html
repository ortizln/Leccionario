
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Acciones de Personal</h5>
      <button class="btn btn-primary btn-sm" (click)="openForm()"><i class="bi bi-plus me-1"></i>Nueva Accion</button>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm mb-0">
            <thead class="table-light"><tr><th>Empleado ID</th><th>Tipo</th><th>Descripcion</th><th>Severidad</th><th>Fecha</th><th></th></tr></thead>
            <tbody>
              <tr *ngFor="let a of actions">
                <td>{{ a.employeeId }}</td>
                <td><span class="badge bg-info">{{ a.actionType }}</span></td>
                <td>{{ a.description | slice:0:60 }}</td>
                <td><span class="badge" [ngClass]="{'bg-danger': a.severity==='GRAVE','bg-warning text-dark': a.severity==='MODERADA','bg-secondary': a.severity==='LEVE'}">{{ a.severity }}</span></td>
                <td>{{ a.actionDate | date:'dd/MM/yyyy' }}</td>
                <td><button class="btn btn-outline-danger btn-sm" (click)="remove(a.id!)"><i class="bi bi-trash"></i></button></td>
              </tr>
              <tr *ngIf="!actions.length"><td colspan="6" class="text-center text-muted">Sin acciones registradas</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal fade show d-block" *ngIf="showForm" tabindex="-1" style="background:rgba(0,0,0,0.5)">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h6 class="modal-title">Nueva Accion</h6><button class="btn-close" (click)="showForm=false"></button></div>
        <div class="modal-body">
          <div class="mb-2"><label class="form-label small">Empleado ID</label><input type="number" class="form-control form-control-sm" [(ngModel)]="form.employeeId"></div>
          <div class="mb-2"><label class="form-label small">Tipo</label><select class="form-select form-select-sm" [(ngModel)]="form.actionType"><option>AUDITORIA</option><option>AMONESTACION</option><option>SUSPENSION</option><option>DESPIDO</option><option>RECONOCIMIENTO</option></select></div>
          <div class="mb-2"><label class="form-label small">Descripcion</label><textarea class="form-control form-control-sm" rows="2" [(ngModel)]="form.description"></textarea></div>
          <div class="mb-2"><label class="form-label small">Severidad</label><select class="form-select form-select-sm" [(ngModel)]="form.severity"><option>LEVE</option><option>MODERADA</option><option>GRAVE</option></select></div>
          <div class="mb-2"><label class="form-label small">Observaciones</label><textarea class="form-control form-control-sm" rows="2" [(ngModel)]="form.observations"></textarea></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary btn-sm" (click)="showForm=false">Cancelar</button><button class="btn btn-primary btn-sm" (click)="save()">Guardar</button></div>
      </div></div>
    </div>
