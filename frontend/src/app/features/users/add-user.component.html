
    <div class="p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="h6 mb-0"><i class="bi bi-person-plus me-2"></i>{{ mode === 'edit' ? 'Editar usuario' : 'Nuevo usuario' }}</h3>
        <button class="btn btn-sm btn-outline-secondary" type="button" (click)="cancel.emit()"><i class="bi bi-x-lg"></i></button>
      </div>

      @if (errorMessage) {
        <div class="alert alert-warning py-2 mb-3 small">{{ errorMessage }}</div>
      }

      <form [formGroup]="form" class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold small">Usuario</label>
          <input class="form-control form-control-sm" type="text" formControlName="username">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold small">Correo</label>
          <input class="form-control form-control-sm" type="email" formControlName="email">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold small">Contrasena {{ mode === 'edit' ? '(opcional)' : '' }}</label>
          <input class="form-control form-control-sm" type="password" formControlName="password">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold small">Identificacion</label>
          <input class="form-control form-control-sm" type="text" formControlName="identification">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold small">Nombres</label>
          <input class="form-control form-control-sm" type="text" formControlName="firstName">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold small">Apellidos</label>
          <input class="form-control form-control-sm" type="text" formControlName="lastName">
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-semibold small">Institucion</label>
          <select class="form-select form-select-sm" formControlName="institutionId">
            @for (institution of institutions; track institution.id) {
              <option [value]="institution.id">{{ institution.name }}</option>
            }
          </select>
        </div>
        <div class="col-12 col-md-6 d-flex align-items-end">
          <div class="form-check form-switch border rounded px-3 py-2 w-100">
            <input class="form-check-input" id="enabled" type="checkbox" formControlName="enabled">
            <label class="form-check-label ms-2 fw-semibold small" for="enabled">Usuario activo</label>
          </div>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold small">Perfiles asignados</label>
          <div class="row g-2">
            @for (role of roles; track role.name) {
              <div class="col-12 col-md-6">
                <label class="d-flex align-items-start gap-2 p-2 rounded border small">
                  <input class="form-check-input mt-1" type="checkbox"
                        [checked]="selectedRoleNames.has(role.name)"
                        (change)="toggleRole(role.name, $any($event.target).checked)">
                  <span>
                    <span class="fw-semibold d-block">{{ formatRole(role.name) }}</span>
                    <span class="text-muted">{{ role.description }}</span>
                  </span>
                </label>
              </div>
            }
          </div>
        </div>

        <div class="col-12 d-flex justify-content-end gap-2 mt-2">
          <button class="btn btn-sm btn-outline-secondary" type="button" (click)="cancel.emit()">Cancelar</button>
          <button class="btn btn-sm btn-primary" type="button" (click)="submit()">
            <i class="bi bi-check-lg me-1"></i>{{ mode === 'edit' ? 'Guardar' : 'Crear' }}
          </button>
        </div>
      </form>
    </div>
