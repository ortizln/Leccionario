spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/leccionario_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        "format_sql": true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 0

security:
  jwt:
    secret: test-secret-key-for-unit-tests-32chars!!
    expiration: 86400000

logging:
  level:
    root: WARN
    "com.leccionario.backend": WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
