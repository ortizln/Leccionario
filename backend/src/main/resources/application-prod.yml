spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leccionario}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        "format_sql": false
        jdbc:
          "time_zone": UTC
        generate_statistics: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:1080}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 1024

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:1800000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    root: WARN
    "com.leccionario.backend": INFO
    "org.springframework.security": WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

branding:
  storage:
    path: ${BRANDING_PATH:./storage/branding}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://alan-tek.com,http://alan-tek.com,http://192.168.1.43,http://192.168.1.27}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
