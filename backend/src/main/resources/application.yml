spring:
  application:
    name: leccionario-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leccionario}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        "format_sql": true
        jdbc:
          "time_zone": UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  address: 0.0.0.0
  port: 1080

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 1800000
    refresh-expiration: 604800000

logging:
  level:
    root: INFO
    "com.leccionario.backend": DEBUG

branding:
  storage:
    path: ./storage/branding

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

cors:
  allowed-origins: http://localhost:4200

mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
