version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leccionario-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:-192.168.1.43}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-leccionario}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:?Configura DB_PASS en .env o como variable de entorno}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env o como variable de entorno}
      SERVER_PORT: ${CONTAINER_PORT:-1080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,https://alan-tek.com,http://alan-tek.com,http://192.168.1.43}
    ports:
      - "${HOST_PORT:-1080}:${CONTAINER_PORT:-1080}"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: leccionario-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
